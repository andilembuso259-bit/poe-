<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawPal - User Dashboard & Messages</title>
  <style>
    :root { --primary: #1b4332; --primary-light: #2d6a4f; --accent: #e9c46a; --bg: #f8f9fa; --text: #2b2d42; --card-bg: #fff; --border: #e9ecef; --font-scale: 1; }
    body.high-contrast { --primary: #000; --primary-light: #111; --accent: #ffff00; --bg: #fff; --text: #000; --card-bg: #fff; --border: #000; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; font-size: calc(16px * var(--font-scale)); }

    .a11y-bar { background: #111; color: #fff; padding: 6px 5%; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .a11y-btn { background: #333; color: #fff; border: 1px solid #555; padding: 3px 8px; cursor: pointer; border-radius: 3px; }

    header { background: var(--primary); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: bold; color: white; text-decoration: none; }
    nav a { color: white; text-decoration: none; padding: 6px 12px; border-radius: 4px; }
    nav a:hover, nav a.active { background: var(--primary-light); }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 5%; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .dash-card { background: var(--card-bg); padding: 25px; border-radius: 8px; border: 1px solid var(--border); }

    .booking-item { border: 1px solid var(--border); border-left: 4px solid var(--primary); padding: 12px; margin-top: 10px; border-radius: 4px; background: #fafafa; }
    
    /* Messaging Box */
    .chat-box { border: 1px solid #ccc; height: 220px; overflow-y: auto; padding: 10px; border-radius: 4px; background: #fff; margin-bottom: 10px; }
    .msg { margin-bottom: 8px; padding: 6px 10px; border-radius: 6px; max-width: 80%; font-size: 0.85rem; }
    .msg-sent { background: #e2f0d9; margin-left: auto; text-align: right; }
    .msg-rec { background: #f1f3f5; }
    
    .chat-inputs { display: flex; gap: 8px; }
    .chat-inputs input { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .btn-send { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="a11y-bar">
    <span>WCAG Controls</span>
    <div>
      <button class="a11y-btn" onclick="adjustText(-1)">A-</button>
      <button class="a11y-btn" onclick="adjustText(1)">A+</button>
      <button class="a11y-btn" onclick="toggleContrast()">High Contrast</button>
    </div>
  </div>

  <header>
    <a href="index.html" class="logo">🐾 PawPal</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="search.html">Find Sitters</a>
      <a href="profile.html">Sitter Profile</a>
      <a href="mypets.html">My Pets</a>
      <a href="dashboard.html" class="active">Dashboard</a>
    </nav>
  </header>

  <div class="container">
    <!-- Active Bookings Tracker -->
    <main class="dash-card">
      <h2>📋 Active Stays & Requests</h2>
      <div id="bookings-list">
        <!-- Rendered via JS -->
      </div>
    </main>

    <!-- Encrypted Messaging Panel -->
    <aside class="dash-card">
      <h2>💬 Direct Sitter Messages</h2>
      <p style="font-size:0.85rem; color:#666; margin-bottom:10px;">Chatting with <strong>Sarah Jenkins</strong></p>
      
      <div class="chat-box" id="chat-messages">
        <div class="msg msg-rec"><strong>Sarah:</strong> Hello! Looking forward to caring for Milo. Any special routine I should know about?</div>
      </div>

      <form class="chat-inputs" onsubmit="sendMessage(event)">
        <input type="text" id="chat-input" placeholder="Type your care instructions..." required>
        <button type="submit" class="btn-send">Send</button>
      </form>
    </aside>
  </div>

  <script>
    function loadBookings() {
      const bookings = JSON.parse(localStorage.getItem('pawpal_bookings')) || [
        { sitter: "Sarah Jenkins", pet: "Milo (Golden Retriever)", days: "2", status: "Confirmed", date: "2026-09-24" }
      ];

      const list = document.getElementById('bookings-list');
      list.innerHTML = bookings.map(b => `
        <div class="booking-item">
          <strong>Sitter: ${b.sitter}</strong><br>
          <span style="font-size:0.85rem; color:#555;">Pet: ${b.pet} (${b.days} Days)</span><br>
          <span style="font-size:0.8rem; background:#d4edda; color:#155724; padding:2px 6px; border-radius:4px; display:inline-block; margin-top:4px;">Status: ${b.status}</span>
        </div>
      `).join('');
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      
      if (!text) return;

      const chatBox = document.getElementById('chat-messages');
      chatBox.innerHTML += `<div class="msg msg-sent"><strong>You:</strong> ${text}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    loadBookings();

    let fontScale = 1;
    function adjustText(d) { fontScale = d === 0 ? 1 : fontScale + d * 0.1; document.documentElement.style.setProperty('--font-scale', fontScale); }
    function toggleContrast() { document.body.classList.toggle('high-contrast'); }
  </script>
</body>
</html>
